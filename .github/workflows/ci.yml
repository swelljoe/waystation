name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libx11-dev python3-pil
      - run: python3 scripts/build-assets.py
      # Artists get added to and dropped from the wardrobe, and a credits page
      # that has stopped matching the art it credits is worse than none: it
      # names the wrong people with confidence.
      - name: Credits page still matches the art it credits
        run: python3 scripts/build-about-page.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Asset build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      # The submitted demo link is a GitHub Pages URL and cannot be moved. Pages
      # is a static host with no `/api/interpret` to answer, so this build is
      # told where the listening actually lives; the server names this origin in
      # WAYSTATION_ALLOWED_ORIGINS so the browser will carry the request.
      - name: Build browser game
        env:
          WAYSTATION_API_ORIGIN: https://waystation.fly.dev
        run: make web

      # A build that lost the origin is the quiet failure: every request 404s,
      # every traveler falls back to the reviewed fixture, and the game looks
      # exactly like one that is thinking. Check the bundle, not the variable.
      - name: Refuse to publish a build that cannot reach the API
        run: |
          if ! grep -qa "https://waystation.fly.dev" dist/*.wasm; then
            echo "::error::the built bundle carries no API origin, so the"
            echo "published game would silently serve reviewed fixtures."
            exit 1
          fi
      # The licensed art reaches the browser bundle from a separate private
      # repository, never from this one. A Release inherits its repository's
      # visibility and has none of its own, so a tarball here would be an asset
      # pack anyone could take without the game around it. Served from the built
      # bundle it is just a game shipping its assets, which is what these
      # licences allow. Needs the ASSET_REPO variable and the ASSET_TOKEN secret
      # — a fine-grained token with read access to that repository's contents.
      - name: Add licensed demo runtime art
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.ASSET_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.ASSET_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/waystation-demo-assets"
          gh release download demo-runtime-assets \
            --repo "${{ vars.ASSET_REPO }}" \
            --pattern waystation-runtime-assets.tar.gz \
            --dir "$RUNNER_TEMP/waystation-demo-assets"
          tar -xzf "$RUNNER_TEMP/waystation-demo-assets/waystation-runtime-assets.tar.gz" \
            -C dist
      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: waystation-web
          path: dist
          if-no-files-found: error
      # The published link is written into a submission and cannot be moved, so
      # it must never quietly become the fallback build. A missing ASSET_REPO
      # skips the step above without failing it, and the procedural stand-in art
      # is a complete, plausible-looking game — nothing downstream would notice.
      # Licensed audio is the tell: a build without the private sources ships no
      # audio at all.
      - name: Refuse to publish the fallback build
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          if [ ! -f dist/runtime-assets/audio/music/andriig-sad-instrumental.mp3 ]; then
            echo "::error::dist holds the procedural fallback art, not the licensed build."
            echo "Set the ASSET_REPO variable and the ASSET_TOKEN secret, or this"
            echo "would publish stand-in art to the submitted demo link."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-web:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
