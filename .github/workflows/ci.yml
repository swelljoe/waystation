name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libx11-dev python3-pil
      - run: python3 scripts/build-assets.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Asset build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Build browser game
        run: make web
      - name: Add licensed demo runtime art
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/waystation-demo-assets"
          gh release download demo-runtime-assets \
            --pattern waystation-runtime-assets.tar.gz \
            --dir "$RUNNER_TEMP/waystation-demo-assets"
          tar -xzf "$RUNNER_TEMP/waystation-demo-assets/waystation-runtime-assets.tar.gz" \
            -C dist
      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: waystation-web
          path: dist
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-web:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
