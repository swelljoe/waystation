<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A cozy post-apocalyptic game about literacy, hospitality, and a book that survived."
    />
    <title>The Waystation at the Edge of the Ash</title>
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="waystation-game"
      data-wasm-opt="z"
    />
    <link data-trunk rel="copy-dir" href="../runtime-assets" />
    <!-- Generated by `make about`, never edited by hand. Trunk copies it as-is;
         it is a plain page with no wasm in it. -->
    <link data-trunk rel="copy-file" href="about.html" />
    <style>
      @font-face {
        font-family: "EB Garamond";
        src: url("runtime-assets/fonts/EBGaramond-Variable.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        background: #151613;
        color: #eadcb9;
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, #293023 0, #151613 55%, #090a08 100%);
      }
      canvas {
        width: min(100vw, 177.777vh) !important;
        height: min(56.25vw, 100vh) !important;
        image-rendering: pixelated;
        outline: 1px solid #6f603f;
        box-shadow: 0 18px 80px #000b;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-content: center;
        gap: 0.65rem;
        text-align: center;
        color: #a99a77;
        background: radial-gradient(circle at 50% 42%, #293023 0, #151613 55%, #090a08 100%);
      }
      .start-game {
        min-width: 14rem;
        padding: 0.6rem 1.2rem 0.7rem;
        border: 1px solid #88764f;
        border-radius: 0.2rem;
        color: #eadcb9;
        background: #29271f;
        font: 600 1.35rem/1 "EB Garamond", Georgia, "Times New Roman", serif;
        cursor: pointer;
        box-shadow: 0 6px 24px #0008;
      }
      .start-game:hover:not(:disabled),
      .start-game:focus-visible {
        border-color: #c3a96f;
        background: #373225;
        outline: 2px solid #c3a96f55;
        outline-offset: 3px;
      }
      .start-game:disabled {
        color: #7f765f;
        cursor: wait;
      }
      .start-note {
        margin: 0;
        font-size: 1rem;
      }
      .credits-link {
        position: fixed;
        right: 0.7rem;
        bottom: 0.35rem;
        /* Above the start screen, not only above the canvas. Somebody who wants
           to know who made this should not have to enter the game first. */
        z-index: 4;
        color: #a99a77;
        font-size: 0.85rem;
        text-decoration-color: #6f603f;
      }
      .credits-link:hover,
      .credits-link:focus-visible {
        color: #eadcb9;
      }
    </style>
  </head>
  <body>
    <noscript>This game requires WebAssembly and JavaScript.</noscript>
    <div class="loading" role="status" aria-live="polite">
      <button class="start-game" type="button" disabled>Lighting the hearth…</button>
      <p class="start-note">Sound begins when you enter.</p>
    </div>
    <!-- A new tab, so somebody who reads the credits mid-visit comes back to
         the traveler still standing there rather than to a reloaded game. -->
    <a class="credits-link" href="about.html" target="_blank" rel="noopener"
      >About &amp; credits</a
    >
    <script>
      const loading = document.querySelector(".loading");
      const startButton = document.querySelector(".start-game");
      let started = false;

      const enableStart = () => {
        startButton.disabled = false;
        startButton.textContent = "Enter the Waystation";
      };

      if (window.wasmBindings?.start_web_game) {
        enableStart();
      } else {
        window.addEventListener("TrunkApplicationStarted", enableStart, { once: true });
      }

      startButton.addEventListener("click", () => {
        if (started || !window.wasmBindings?.start_web_game) return;
        started = true;
        startButton.disabled = true;
        startButton.textContent = "Opening the door…";
        window.wasmBindings.start_web_game();
      });

      const observer = new MutationObserver(() => {
        if (document.querySelector("canvas")) {
          loading.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
