<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A cozy post-apocalyptic game about literacy, hospitality, and a book that survived."
    />
    <title>The Waystation at the Edge of the Ash</title>
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="waystation-game"
      data-wasm-opt="z"
    />
    <link data-trunk rel="copy-dir" href="../runtime-assets" />
    <style>
      @font-face {
        font-family: "EB Garamond";
        src: url("runtime-assets/fonts/EBGaramond-Variable.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        background: #151613;
        color: #eadcb9;
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, #293023 0, #151613 55%, #090a08 100%);
      }
      canvas {
        width: min(100vw, 177.777vh) !important;
        height: min(56.25vw, 100vh) !important;
        image-rendering: pixelated;
        outline: 1px solid #6f603f;
        box-shadow: 0 18px 80px #000b;
      }
      .loading {
        position: fixed;
        inset: auto 0 1rem;
        text-align: center;
        color: #a99a77;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <noscript>This game requires WebAssembly and JavaScript.</noscript>
    <div class="loading">Lighting the hearth…</div>
    <script>
      const observer = new MutationObserver(() => {
        if (document.querySelector("canvas")) {
          document.querySelector(".loading")?.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
